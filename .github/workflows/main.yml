name: Mod SDcard

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      bootloader:
        description: "Select Bootloader"
        required: true
        default: "b860h"
        type: choice
        options:
          - b860h
          - hg680p
      fw_link:
        description: "Insert Firmware Link"
        required: true
        default: ""

# WAJIB untuk create release
permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: SetUp environment
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc >/dev/null 2>&1
        sudo apt-get -qq update
        sudo apt-get -y install wget python3 xz-utils gzip
        sudo pip3 install gdown
        sudo pip3 install git+https://github.com/Juvenal-Yescas/mediafire-dl
        wget https://mega.nz/linux/repo/xUbuntu_22.04/amd64/megacmd-xUbuntu_22.04_amd64.deb
        sudo apt install ./megacmd-xUbuntu_22.04_amd64.deb

        # JANGAN sudo
        mkdir -p openwrt

    - name: Download Firmware
      run: |
        LINK="${{ github.event.inputs.fw_link }}"
        OUT="openwrt/$(basename "$LINK")"

        if echo "$LINK" | grep -q "drive."; then
          ID=$(echo "$LINK" | sed -n 's|.*id=\([^&]*\).*|\1|p')
          [ -z "$ID" ] && ID=$(echo "$LINK" | awk -F/ '{print $6}')
          gdown "$ID" -O "$OUT"

        elif echo "$LINK" | grep -q "mediafire.com"; then
          mediafire-dl "$LINK" -o "$OUT"

        elif echo "$LINK" | grep -q "mega.nz"; then
          FILE=$(mega-get "$LINK" | awk -F: '{print $2}')
          mv "$FILE" "$OUT"

        else
          wget --no-check-certificate "$LINK" -O "$OUT"
        fi

    - name: Get extension
      run: |
        FILE=$(find openwrt -name "*.img.*")
        EXT=$(basename "$FILE" | sed -E 's/.*\.(img\.(gz|xz))$/\1/')
        NAME=$(basename "$FILE" | sed -E 's/\.(gz|xz)$//')
        echo "file_type=$EXT" >> $GITHUB_ENV
        echo "file_name=$NAME" >> $GITHUB_ENV

    - name: Extract firmware
      run: |
        cd openwrt
        mkdir -p boot

        cp ../BootCardMaker/u-boot.bin .
        cp ../files/mod-boot-sdcard.tar.gz .

        if [ "$file_type" = "img.gz" ]; then
          gunzip "$file_name.gz"
        else
          unxz "$file_name.xz"
        fi

        LOOP=$(sudo losetup -fP --show "$file_name")
        sudo mount ${LOOP}p1 boot
        sudo tar -xzf mod-boot-sdcard.tar.gz -C boot

        UENV=$(grep APPEND boot/uEnv.txt | awk -F "root=" '{print $2}')
        EXTROOT=$(grep append boot/extlinux/extlinux.conf | awk -F "root=" '{print $2}')
        sudo sed -i "s/$EXTROOT/$UENV/g" boot/extlinux/extlinux.conf

        if [ "${{ github.event.inputs.bootloader }}" = "b860h" ]; then
          DTB="meson-gxl-s905x-b860h.dtb"
        else
          DTB="meson-gxl-s905x-p212.dtb"
        fi

        CURDTB=$(grep dtb boot/boot.ini | awk -F "/" '{print $4}' | tr -d '"')
        sudo sed -i "s/$CURDTB/$DTB/g" boot/boot.ini
        sudo sed -i "s/$CURDTB/$DTB/g" boot/extlinux/extlinux.conf
        sudo sed -i "s/$CURDTB/$DTB/g" boot/uEnv.txt

        sudo umount boot
        sudo dd if=u-boot.bin of=$LOOP bs=1 count=444 conv=fsync
        sudo dd if=u-boot.bin of=$LOOP bs=512 skip=1 seek=1 conv=fsync
        sudo losetup -d $LOOP

        if [ "$file_type" = "img.gz" ]; then
          gzip "$file_name"
        else
          xz "$file_name"
        fi

    - name: Find Firmware
      run: |
        FILE_PATH=$(find openwrt -name "*.img.*")
        echo "FILE_PATH=$FILE_PATH" >> $GITHUB_ENV

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: Mutiara-Wrt_Mod_SDCard
        tag_name: mod-sdcard-${{ github.run_number }}
        files: ${{ env.FILE_PATH }}
        body: |
          Mod SDCard
